<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kayuni Intro</title>
<style>
  html,body{margin:0;height:100%;background:#0E0E10;display:grid;place-items:center;overflow:hidden}
  .stage{width:min(72vw,900px);position:relative}
  .stage svg{width:100%;height:auto;display:block}
  .tag{font:500 clamp(10px,1.1vw,14px)/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.42em;
       text-transform:uppercase;color:#F6F5F1;opacity:0;text-align:right;margin-top:1.4em;padding-right:.3em;
       animation:t .9s 2.1s ease-out forwards}
  .rule{height:1px;background:#E09A2F;transform:scaleX(0);transform-origin:left;margin-top:1.2em;
        animation:r 1.1s 1.7s cubic-bezier(.65,0,.35,1) forwards}
  @keyframes t{to{opacity:.72}} @keyframes r{to{transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;animation-delay:0s!important}}
</style></head>
<body><div class="stage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 685.74 205.2" role="img" aria-label="Kayuni">
<title>Kayuni</title>
<style>
  .trace{fill:none;stroke:#E09A2F;stroke-width:1.3;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
         animation:draw 1.1s cubic-bezier(.65,0,.35,1) forwards, fadeout .5s .95s forwards}
  .bird{fill:#F6F5F1;opacity:0;animation:fill .6s .75s ease-out forwards}
  .glide{animation:glide 1.8s cubic-bezier(.16,1,.3,1) both}
  .l{fill:#F6F5F1;opacity:0;transform-box:fill-box;animation:rise .7s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fadeout{to{opacity:0}}
  @keyframes fill{to{opacity:1}}
  @keyframes glide{from{transform:translate(-26px,18px)}to{transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;animation-delay:0s!important}}
</style>
